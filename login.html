{% extends "base.html" %}
{% block title %}Login | CivicTrack{% endblock %}
{% block content %}
<div class="auth-card">
  <p class="eyebrow">WELCOME BACK</p><h1>Login to CivicTrack</h1>
  <form method="post" class="form">
    <label>Email address<input type="email" name="email" required placeholder="you@example.com"></label>
    <label>Password<input type="password" name="password" required placeholder="Your password"></label>
    <button class="btn primary full">Login</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('register_choice') }}">Create an account</a></p>
  <div class="demo-login"><strong>Demo admin</strong><br>Email: admin@civic.local<br>Password: Admin@123</div>
</div>
{% endblock %}
